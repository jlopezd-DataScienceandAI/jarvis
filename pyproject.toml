[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente de voz J.A.R.V.I.S. para Windows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic",
    "elevenlabs",
    "faster-whisper",
    "openwakeword",
    "onnxruntime",
    "sounddevice",
    "numpy",
    "scipy",
    "webrtcvad-wheels",
    "pynput",
    "psutil",
    "mss",
    "pillow",
    "pypdf",
    "pycaw",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "requests",
    "winotify",
    # Windows media session ("what is playing"), for the HUD's music panel.
    "winrt-runtime",
    "winrt-Windows.Media.Control",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Storage.Streams",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
