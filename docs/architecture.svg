<text x="415.0" y="229" class="pill" text-anchor="middle" >IDLE</text>
<text x="454" y="230" class="d" text-anchor="middle" >→</text>
<rect x="466" y="214" width="92" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.6"/>
<text x="512.0" y="229" class="pill" text-anchor="middle" >LISTENING</text>
<text x="570" y="230" class="d" text-anchor="middle" >→</text>
<rect x="582" y="214" width="58" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.6"/>
<text x="611.0" y="229" class="pill" text-anchor="middle" >BUSY</text>
<text x="386" y="260" class="d" text-anchor="start" >one main thread drains an event queue</text>
<text x="386" y="279" class="d" text-anchor="start" >background threads only post events</text>
<text x="386" y="298" class="d" text-anchor="start" >barge-in: cancel flag + stop playback</text>
<rect x="370" y="345" width="310" height="145" rx="10" fill="#121B2F" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="370" y="359" width="3" height="18" rx="1.5" fill="#A78BFA"/>
<text x="386" y="373" class="t" text-anchor="start" >Agent loop · Claude Haiku 5.5</text>
<text x="386" y="396" class="d" text-anchor="start" >hand-written streaming tool loop</text>
<text x="386" y="415" class="d" text-anchor="start" >speaks deltas before the reply ends</text>
<text x="386" y="434" class="d" text-anchor="start" >prompt cache on a frozen prefix</text>
<text x="386" y="453" class="d" text-anchor="start" >cancellable mid-stream (barge-in)</text>
<text x="386" y="472" class="d" text-anchor="start" >auto-reset: idle or &gt; 60K tokens</text>
<rect x="370" y="520" width="310" height="215" rx="10" fill="#121B2F" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="370" y="534" width="3" height="18" rx="1.5" fill="#A78BFA"/>
<text x="386" y="548" class="t" text-anchor="start" >Tool registry · 24 tools</text>
<text x="386" y="571" class="d" text-anchor="start" >pydantic → JSON schema + validation</text>
<text x="386" y="590" class="d" text-anchor="start" >confirmation enforced in code</text>
<text x="386" y="609" class="d" text-anchor="start" >errors returned, never raised</text>
