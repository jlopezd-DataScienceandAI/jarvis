<rect x="78" y="299" width="3" height="18" rx="1.5" fill="#22D3EE"/>
<text x="94" y="313" class="t" text-anchor="start" >Wake detection</text>
<text x="94" y="336" class="n" text-anchor="start" >openWakeWord «Hey Jarvis»</text>
<text x="94" y="354" class="d" text-anchor="start" >instant, works mid-speech</text>
<text x="94" y="378" class="n" text-anchor="start" >NameSpotter «Jarvis»</text>
<text x="94" y="396" class="d" text-anchor="start" >bursts confirmed by Whisper</text>
<text x="94" y="420" class="n" text-anchor="start" >Hotkey · HUD orb</text>
<text x="94" y="438" class="d" text-anchor="start" >Ctrl+Alt+J or a click</text>
<rect x="78" y="477" width="242" height="102" rx="10" fill="#121B2F" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="78" y="491" width="3" height="18" rx="1.5" fill="#22D3EE"/>
<text x="94" y="505" class="t" text-anchor="start" >End-of-speech detection</text>
<text x="94" y="528" class="d" text-anchor="start" >WebRTC VAD + energy gate</text>
<text x="94" y="547" class="d" text-anchor="start" >vs. rolling room-noise level</text>
<text x="94" y="566" class="d" text-anchor="start" >ends on ~0.9 s of quiet</text>
<rect x="78" y="604" width="242" height="102" rx="10" fill="#121B2F" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
<rect x="78" y="618" width="3" height="18" rx="1.5" fill="#22D3EE"/>
<text x="94" y="632" class="t" text-anchor="start" >Speech-to-text</text>
<text x="94" y="655" class="d" text-anchor="start" >faster-whisper · small · int8</text>
<text x="94" y="674" class="d" text-anchor="start" >on CPU, Spanish</text>
<text x="94" y="693" class="d" text-anchor="start" >hallucination filter</text>
<circle cx="86" cy="737" r="4" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
<text x="98" y="741" class="lbl" text-anchor="start" fill="#22D3EE">Speech recognition runs fully offline</text>
