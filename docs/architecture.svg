<text x="756" y="589" class="d" text-anchor="start" >spoken reminder + Windows toast</text>
<text x="756" y="613" class="n" text-anchor="start" >CalendarSync</text>
<text x="756" y="631" class="d" text-anchor="start" >tasks.md → Google Calendar</text>
<text x="756" y="649" class="d" text-anchor="start" >idempotent ids, offline-safe</text>
<text x="756" y="673" class="n" text-anchor="start" >UsageMeter</text>
<text x="756" y="691" class="d" text-anchor="start" >Claude $ + ElevenLabs quota</text>
