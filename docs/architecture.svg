<text x="756" y="203" class="t" text-anchor="start" >HUD · desktop window</text>
<text x="756" y="226" class="d" text-anchor="start" >Hub keeps the latest state</text>
<text x="756" y="245" class="d" text-anchor="start" >local HTTP + SSE on 127.0.0.1</text>
<text x="756" y="264" class="d" text-anchor="start" >Host check + per-session token</text>
<text x="756" y="283" class="d" text-anchor="start" >live panels: system, music, agenda</text>
<rect x="740" y="345" width="310" height="145" rx="10" fill="#121B2F" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.2"/>
