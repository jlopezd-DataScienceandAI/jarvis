<text x="40" y="56" class="h1" text-anchor="start" >J.A.R.V.I.S. — system architecture</text>
<text x="40" y="82" class="sub" text-anchor="start" >Local-first Spanish voice assistant: on-device wake word and speech recognition, a streaming Claude tool-use agent, sentence-by-sentence neural speech.</text>
<line x1="1062" y1="52" x2="1090" y2="52" stroke="#22D3EE" stroke-width="2"/>
