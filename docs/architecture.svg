<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">J.A.R.V.I.S. system architecture</title>
<desc id="desc">On-device wake word, endpointing and Whisper speech recognition feed a voice loop that drives a streaming Claude tool-use agent; replies are streamed sentence by sentence to ElevenLabs. A local HUD, background services and plain-file state complete the system.</desc>
