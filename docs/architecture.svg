<text x="756" y="373" class="t" text-anchor="start" >Streamed speech</text>
<text x="756" y="396" class="d" text-anchor="start" >SentenceChunker: deltas → sentences</text>
<text x="756" y="415" class="d" text-anchor="start" >synthesis thread → playback thread</text>
<text x="756" y="434" class="d" text-anchor="start" >next sentence ready before needed</text>
<text x="756" y="453" class="d" text-anchor="start" >gapless audio to the speakers</text>
