<text x="1115" y="132" class="region" text-anchor="start" >CLOUD APIS</text>
<text x="1115" y="168" class="d" text-anchor="start" >HTTPS only · keys read from .env</text>
<text x="1115" y="187" class="d" text-anchor="start" >transcribed text leaves the PC,</text>
<text x="1115" y="206" class="d" text-anchor="start" >raw microphone audio never does</text>
